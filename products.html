<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sản phẩm mới — Task Manager</title>
    <meta name="description" content="Quản lý sản phẩm mới NEVO 2026"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tabulator for Spreadsheet feel -->
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">
    <!-- Excel Export Support -->
    <script type="text/javascript" src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

    <!-- SweetAlert2 for nice alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Google Identity Services for direct Google Drive API authorization -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary": "#b80035", "primary-dark": "#920028" },
                    fontFamily: { headline: ["Manrope"], body: ["Inter"] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; display: flex; flex-direction: column; }
        .main-container { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; min-height: 0; box-sizing: border-box; }
        .table-wrapper { flex-grow: 1; min-height: 0; }
        .sheet-frame {
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 8px 40px -8px rgba(0,0,0,0.1), 0 2px 12px -2px rgba(0,0,0,0.06);
            background: #fff; border: 1px solid #e2e8f0;
        }
        
        /* Tabulator Styling */
        .tabulator { border: none !important; background-color: white !important; font-family: 'Inter', sans-serif; font-size: 13px; }
        .tabulator-header { 
            background-color: #f8fafc !important; 
            border-bottom: 2px solid #e2e8f0 !important; 
            color: #475569 !important; 
            font-weight: 700; 
        }
        .tabulator-header .tabulator-col { background-color: #f8fafc !important; border-right: 1px solid #e2e8f0 !important; }
        .tabulator-header .tabulator-col-title { color: #475569 !important; }
        .tabulator-header .tabulator-arrow { border-bottom-color: #475569 !important; border-top-color: #475569 !important; }
        .tabulator-col { border-right: 1px solid #e2e8f0 !important; }
        .tabulator-row { border-bottom: 1px solid #e2e8f0 !important; }
        .tabulator-row.tabulator-row-even { background-color: #fff; }
        .tabulator-cell { border-right: 1px solid #e2e8f0 !important; padding: 8px !important; }
        .tabulator-cell.tabulator-editing { border: 2px solid #6366f1 !important; padding: 6px !important; box-shadow: 0 0 5px rgba(99,102,241,0.2); }
        .tabulator-row.tabulator-selected { background-color: #f1f5f9 !important; }
        .tabulator-row.tabulator-selected .tabulator-cell { border-right: 1px solid #e2e8f0 !important; }
        
        .toolbar-btn {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            border: 1px solid #e2e8f0; background: white; color: #475569;
        }
        .toolbar-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .toolbar-btn.primary { background: #b80035; color: white; border-color: #b80035; }
        .toolbar-btn.primary:hover { background: #920028; border-color: #920028; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .status-hoan-tat { background: #dcfce7; color: #166534; }
        .status-dang-xu-ly { background: #fef08a; color: #854d0e; }
        .status-chua-co { background: #e2e8f0; color: #475569; }

        @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.15); } 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse-glow 2s infinite; }
        /* Style Header Filters */
        .tabulator-header-filter input {
            padding: 5px 10px !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 8px !important;
            font-size: 11px !important;
            background: #ffffff !important;
            transition: all 0.2s ease !important;
            margin-top: 4px !important;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02) !important;
        }
        .tabulator-header-filter input:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1) !important;
            outline: none !important;
        }
        .tabulator-header-filter select {
            padding: 4px 8px !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 8px !important;
            font-size: 11px !important;
            background: #ffffff !important;
            margin-top: 4px !important;
        }
        .tabulator-col-title {
            padding-bottom: 2px !important;
            color: #475569 !important;
            font-weight: 800 !important;
            text-transform: uppercase !important;
            font-size: 11px !important;
            letter-spacing: 0.05em !important;
        }
        /* Hover Highlights */
        .tabulator-row:hover {
            background-color: #e0e7ff !important; /* Highlight row */
            transition: background-color 0.1s ease;
        }
        .tabulator-cell:hover {
            background-color: rgba(99, 102, 241, 0.15) !important; /* Highlight cell */
            cursor: pointer;
        }
        /* Image Preview Card */
        #hover-preview-card {
            position: fixed;
            z-index: 9999;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            padding: 10px;
            display: none;
            pointer-events: none;
            border: 1px solid #e2e8f0;
            width: 320px;
            transition: opacity 0.2s ease;
        }
        #hover-preview-card img {
            width: 100%;
            border-radius: 10px;
            object-fit: cover;
            max-height: 400px;
            background: #f1f5f9;
        }
        #hover-preview-card .preview-title {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
        }
        #hover-preview-card .loading-spinner {
            padding: 40px;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>
<body>

<!-- Nav Bar & Search -->
<nav class="bg-white/95 backdrop-blur-xl sticky top-0 z-50 border-b border-slate-200 shadow-sm">
    <div class="flex flex-wrap md:flex-nowrap justify-between items-center w-full px-3 py-2 gap-3">
        <div class="flex items-center gap-3 shrink-0">
            <a href="index.html" class="text-lg font-bold tracking-tighter text-[#131b2e] font-headline flex items-center gap-2">
                <img src="https://bizweb.dktcdn.net/100/598/325/themes/1047287/assets/footers2_one_logo.png?1775450132549" alt="Logo" style="width:24px;height:auto"/>
                <span class="hidden sm:inline">Nevo</span>
            </a>
            <div class="h-4 w-px bg-slate-300"></div>
            <div class="flex items-center gap-1.5 bg-primary/5 px-2 py-1 rounded-md">
                <span class="material-symbols-outlined text-primary text-[16px]">inventory_2</span>
                <span class="text-xs font-bold text-primary font-headline">Sản phẩm mới</span>
            </div>
        </div>

        <!-- Global Search Bar -->
        <div class="flex-grow max-w-md hidden md:block">
            <div class="relative group">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-indigo-500 transition-colors text-[18px]">search</span>
                <input type="text" id="global-search" placeholder="Tìm kiếm sản phẩm, mã, tag..." 
                       class="w-full bg-slate-100 hover:bg-slate-200/80 focus:bg-white border-transparent focus:border-indigo-300 focus:ring-4 focus:ring-indigo-500/10 text-sm rounded-xl pl-9 pr-4 py-1.5 transition-all outline-none text-slate-700 placeholder-slate-400 font-medium">
            </div>
        </div>

        <div class="flex items-center gap-2 shrink-0 order-2 md:order-3">
            <select id="month-selector" class="bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-lg px-2 py-1.5 focus:outline-none cursor-pointer">
            </select>
            <div id="syncStatus" class="flex items-center gap-1.5 px-2 py-1.5 rounded-lg bg-emerald-50 border border-emerald-100 hidden">
                <div class="live-dot" style="width:6px;height:6px;"></div>
                <span class="text-[10px] font-bold text-emerald-700 uppercase tracking-wide">Đã đồng bộ</span>
            </div>
            <a href="index.html" class="flex items-center gap-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700 transition-all">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                <span class="hidden sm:inline">Quay lại</span>
            </a>
        </div>
    </div>
</nav>

<!-- Main -->
<main class="flex-grow flex flex-col p-2 min-h-0 bg-slate-50/50">


    <!-- Compact Toolbar & Stats -->
    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-2 mb-2 bg-white p-2 rounded-xl border border-slate-200 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)]">
        
        <!-- Toolbar -->
        <div class="flex flex-wrap gap-1.5">
            <button id="btn-add-row" class="px-2.5 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-all font-bold flex items-center gap-1 text-[11px] shadow-sm">
                <span class="material-symbols-outlined text-[14px]">add_circle</span> Dòng mới
            </button>
            <button id="btn-add-col" class="px-2.5 py-1.5 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-200 transition-all font-bold flex items-center gap-1 text-[11px]">
                <span class="material-symbols-outlined text-[14px]">view_column</span> Thêm cột
            </button>
            <button id="btn-color-row" class="px-2.5 py-1.5 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-200 transition-all font-bold flex items-center gap-1 text-[11px]">
                <span class="material-symbols-outlined text-[14px]">palette</span> Tô màu
            </button>
            <button id="btn-import-trigger" class="px-2.5 py-1.5 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-200 transition-all font-bold flex items-center gap-1 text-[11px]">
                <span class="material-symbols-outlined text-[14px]">upload_file</span> Nhập Excel
            </button>
            <input type="file" id="file-import-csv" class="hidden" accept=".csv, .xlsx">
            <button id="btn-export" class="px-2.5 py-1.5 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-200 transition-all font-bold flex items-center gap-1 text-[11px]">
                <span class="material-symbols-outlined text-[14px]">download</span> Xuất Excel
            </button>
            <button id="btn-manage-status" class="px-2.5 py-1.5 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-200 transition-all font-bold flex items-center gap-1 text-[11px]">
                <span class="material-symbols-outlined text-[14px]">settings_suggest</span> Trạng thái
            </button>
            <button id="btn-connect-drive" class="px-2.5 py-1.5 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-lg hover:bg-emerald-100 transition-all font-bold flex items-center gap-1 text-[11px]">
                <span class="material-symbols-outlined text-[14px]">add_to_drive</span> Kết nối Drive
            </button>
            <button id="btn-delete-rows" class="px-2.5 py-1.5 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg hover:bg-rose-100 transition-all font-bold flex items-center gap-1 text-[11px]">
                <span class="material-symbols-outlined text-[14px]">delete_sweep</span> Xóa
            </button>
        </div>

        <!-- Stats Line -->
        <div class="flex flex-wrap items-center gap-3 px-3 py-1.5 bg-slate-50 rounded-lg border border-slate-100 text-[11px] whitespace-nowrap">
            <div class="flex items-center gap-1"><span class="text-slate-500 font-bold uppercase text-[9px]">Dòng:</span> <span id="stat-rows" class="font-black text-slate-700 text-xs">0</span></div>
            <div class="w-px h-3 bg-slate-300"></div>
            <div class="flex items-center gap-1"><span class="text-slate-500 font-bold uppercase text-[9px]">Tổng SL:</span> <span id="stat-total" class="font-black text-slate-700 text-xs">0</span></div>
            <div class="w-px h-3 bg-slate-300"></div>
            <div class="flex items-center gap-1"><span class="text-indigo-500 font-bold uppercase text-[9px]">Mã SP:</span> <span id="stat-ma10" class="font-black text-indigo-600 text-xs">0</span></div>
            <div class="w-px h-3 bg-slate-300"></div>
            <div class="flex items-center gap-1" title="Hoàn tất ảnh trải sàn"><span class="text-emerald-500 font-bold uppercase text-[9px]">Trải sàn:</span> <span id="stat-traisan" class="font-black text-emerald-600 text-xs">0</span></div>
            <div class="w-px h-3 bg-slate-300"></div>
            <div class="flex items-center gap-1" title="Hoàn tất ảnh Model"><span class="text-blue-500 font-bold uppercase text-[9px]">Model:</span> <span id="stat-model" class="font-black text-blue-600 text-xs">0</span></div>
            <div class="w-px h-3 bg-slate-300"></div>
            <div class="flex items-center gap-1" title="Hoàn tất Video"><span class="text-purple-500 font-bold uppercase text-[9px]">Video:</span> <span id="stat-video" class="font-black text-purple-600 text-xs">0</span></div>
        </div>
    </div>
    
    <div class="flex justify-between items-center mb-1.5 px-1">
        <p class="text-[10px] text-slate-500 font-medium inline-flex items-center bg-white px-2 py-0.5 rounded-md border border-slate-200">
            <span class="material-symbols-outlined text-blue-500 text-[12px] mr-1">info</span>
            Giữ <b>Alt</b> (hoặc <b>Option</b>) + Kéo chuột để Fill Down. Chuột phải vào tiêu đề cột để xoá. Nhấp đúp ô để sửa.
        </p>
    </div>

    <!-- Table Area -->
    <div class="flex-grow min-h-0">
        <div id="products-table" class="sheet-frame border border-slate-200 h-full"></div>
    </div>
</main>

    <div id="sync-indicator">
        <span class="material-symbols-outlined animate-spin text-[16px]">sync</span>
        Đang đồng bộ...
    </div>

    <!-- Hover Preview Card -->
    <div id="hover-preview-card">
        <div class="loading-spinner">
            <span class="material-symbols-outlined animate-spin text-[24px]">sync</span>
            <p class="text-xs mt-2">Đang tải ảnh từ Drive...</p>
        </div>
        <img id="preview-img" src="" alt="Preview" style="display:none">
        <div id="preview-title" class="preview-title"></div>
    </div>

    <script type="module" src="products.js?v=3.1"></script>
</body>
</html>
